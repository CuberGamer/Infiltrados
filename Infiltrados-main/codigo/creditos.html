<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infiltrados - Créditos</title>
    <!-- Conectamos los estilos -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/creditos.css">
</head>
<body>

    <!-- Bloqueo vertical para celulares -->
    <div class="bloqueo-vertical">
        <div class="mensaje-giro">
            <span>🔄</span>
            <p>Por favor, gira tu dispositivo en posición horizontal para jugar.</p>
        </div>
    </div>

    <div class="pantalla-completa">
        
        <!-- Tablero central de créditos -->
        <div class="tablero-config" id="contenedor-juego">
            
            <h1 class="titulo-config">CREDITOS</h1>

            <div class="contenido-creditos">
                
                <!-- Desarrollo Visual -->
                <div class="seccion-credito">
                    <h2>DESARROLLO VISUAL:</h2>
                    <div class="nombres-grid">
                        <span>MALENA URZAGASTI</span>
                        <span>KEVIN HUANCA</span>
                        <span>AXEL ARICOMA</span>
                        <span>MATEO SILES</span>
                    </div>
                </div>

                <!-- Diálogos -->
                <div class="seccion-credito">
                    <h2>DIALOGOS:</h2>
                    <div class="nombres-grid">
                        <span>KEVIN HUANCA</span>
                        <span>MALENA URZAGASTI</span>
                    </div>
                </div>

                <!-- Programación -->
                <div class="seccion-credito">
                    <h2>PROGRAMACION:</h2>
                    <div class="nombres-grid">
                        <span>AXEL ARICOMA</span>
                        <span>MATEO SILES</span>
                    </div>
                </div>

            </div>

            <!-- Botón Volver -->
            <button class="boton-volver" id="boton-volver-menu">
                <span class="texto-volver">VOLVER</span>
                <span class="icono-volver">↪</span>
            </button>

        </div>

    </div>

    <!-- Script de escalado y navegación -->
    <script src="JavaScript/creditos.js"></script>

</body>
</html>
